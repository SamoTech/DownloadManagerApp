plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.downloadmanager'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.samotech.Lucadownloadmanager"
        minSdk = 24
        targetSdk = 36
        versionCode = 21
        versionName = "21.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile = System.getenv("KEYSTORE_PATH") ? file(System.getenv("KEYSTORE_PATH")) : null
            storePassword = System.getenv("STORE_PASSWORD")
            keyAlias = "upload"
            keyPassword = System.getenv("KEY_PASSWORD")
        }
        debugConfig {
            storeFile = file("${rootDir}/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debugConfig
        }
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
        disable += [
            'HardcodedText',
            'SetTextI18n',
            'UnusedResources',
            'GradleDependency',
            'NewerVersionAvailable',
            'UseKtx',
            'Overdraw',
            'SmallSp',
            'TypographyEllipsis',
            'IconLauncherShape',
            'IconLocation',
            'NotifyDataSetChanged',
            'InflateParams',
            'NestedWeights',
            'PluralsCandidate',
            'KeyboardInaccessibleWidget'
        ]
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    androidResources {
        noCompress += ['mp4', 'mp3', 'flac', 'm4a', 'ogg', 'wav', 'webm', 'mkv']
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    implementation 'androidx.media3:media3-extractor:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    implementation "androidx.room:room-runtime:2.7.0"
    implementation "androidx.room:room-ktx:2.7.0"

    implementation "androidx.work:work-runtime-ktx:2.10.0"

    testImplementation 'junit:junit:4.13.2'
}
